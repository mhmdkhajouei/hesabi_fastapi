info:
  name: List of all transactions
  type: http
  seq: 4
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/transactions/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "amount": 0,
              "type": "income",
              "date": "",
              "note": "",
              "category_id": "",
              "id": 0,
              "currency": ""
            }
          ]
