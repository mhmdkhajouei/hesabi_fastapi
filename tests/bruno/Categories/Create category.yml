info:
  name: Create category
  type: http
  seq: 5
  tags:
    - Categories

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories/"
  body:
    type: json
    data: |-
      {
        "name": "",
        "budget_goal": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/categories/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "budget_goal": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "",
            "budget_goal": 0,
            "id": 0
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/categories/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "budget_goal": 0
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
