info:
  name: Get all categories
  type: http
  seq: 3
  tags:
    - Compute

http:
  method: GET
  url: "{{baseUrl}}/api/v1/compute/categories"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/compute/categories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "name": "",
              "budget_goal": 0,
              "spent": 0,
              "remaining": 0
            }
          ]
