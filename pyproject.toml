[project]
name = "hesabi-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "mhmdkhajouei", email = "muhammadkhajouei@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.13.3",
  "apscheduler>=3.11.3",
  "asyncpg>=0.30.0",
  "dramatiq[redis]>=1.17.0",
  "email-validator>=2.3.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "openapi-spec-validator>=0.9.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-sdk>=1.27.0",
  "passlib[bcrypt]>=1.7.4",
  "prometheus-client>=0.21.0",
  "pwdlib[argon2]>=0.3.0",
  "pybreaker>=1.3.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pyjwt[crypto]>=2.9.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.12",
  "redis>=5.1.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "tenacity>=9.1.4",
  "testcontainers[postgres]>=4.8.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "httpx>=0.28.1",
  "mypy>=2.3.1",
  "pip-audit>=2.10.1",
  "py-spy>=0.4.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-env>=1.7.1",
  "pytest-mock>=3.16.0",
  "ruff>=0.16.4",
  "testcontainers[postgres]>=4.15.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
env = ["ENV=test"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
