services:
  db:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "idle_in_transaction_session_timeout=5min"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_DB: hesabi_db
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: hesabi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: dramatiq app.worker
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
