info:
  name: Get single transaction
  type: http
  seq: 1
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/:transaction_id"
  params:
    - name: transaction_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/transactions/:transaction_id"
      method: GET
      params:
        - name: transaction_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "type": "income",
            "date": "",
            "note": "",
            "category_id": "",
            "id": 0,
            "currency": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/transactions/:transaction_id"
      method: GET
      params:
        - name: transaction_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
