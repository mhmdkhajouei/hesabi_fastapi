info:
  name: Create a transaction
  type: http
  seq: 5
  tags:
    - Transactions

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transactions/"
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "type": "income",
        "date": "",
        "note": "",
        "category_id": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/transactions/"
      method: POST
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "type": "income",
            "date": "",
            "note": "",
            "category_id": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "type": "income",
            "date": "",
            "note": "",
            "category_id": "",
            "id": 0,
            "currency": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/transactions/"
      method: POST
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "type": "income",
            "date": "",
            "note": "",
            "category_id": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
