[project]
name = "hesabi-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mhmdkhajouei", email = "muhammadkhajouei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "dramatiq[redis]>=1.17.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.21.0",
    "pwdlib[argon2]>=0.3.0",
    "pybreaker>=1.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.12",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4.0",
    "testcontainers[postgres]>=4.8.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "ruff>=0.16.4",
]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]