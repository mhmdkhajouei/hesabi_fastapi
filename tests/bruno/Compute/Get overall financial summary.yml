info:
  name: Get overall financial summary
  type: http
  seq: 1
  tags:
    - Compute

http:
  method: GET
  url: "{{baseUrl}}/api/v1/compute/summary"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/compute/summary"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "income": 0,
            "expense": 0,
            "total": 0,
            "currency": ""
          }
